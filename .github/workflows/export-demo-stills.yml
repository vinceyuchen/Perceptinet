name: Export actual CARLA demo screenshots

on:
  push:
    paths:
      - '.github/workflows/export-demo-stills.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export real still frames from existing demo recordings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/screenshots
          for kind in 1 2; do
            video="assets/scenario-${kind}.mp4"
            duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")
            for pct in 25 50 75; do
              timestamp=$(awk -v d="$duration" -v p="$pct" 'BEGIN {printf "%.3f", d*p/100}')
              ffmpeg -hide_banner -loglevel error -y -ss "$timestamp" -i "$video" -frames:v 1 -vf "scale='min(1280,iw)':-2" -q:v 4 "assets/screenshots/scenario-${kind}-${pct}.jpg"
            done
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/*.jpg
          git commit -m "Add authentic screenshots from CARLA demo recordings"
          git push
